<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Donezo Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="app">

    <!-- ================= SIDEBAR ================= -->
    <aside class="sidebar">

      <!-- Logo -->
      <div class="logo">
        <div class="logo-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
            <circle cx="12" cy="12" r="9" />
            <circle cx="12" cy="12" r="3" />
          </svg>
        </div>
        <span class="logo-text">Donezo</span>
      </div>

      <!-- Main menu -->
      <div class="nav-section">
        <p class="nav-label">MENU</p>

        <nav class="nav-list">
          <a href="#" class="nav-item active">
            <span class="nav-icon">▦</span>
            <span>Dashboard</span>
          </a>

          <a href="#" class="nav-item">
            <span class="nav-icon">📋</span>
            <span>Tasks</span>
            <span class="badge">12+</span>
          </a>

          <a href="#" class="nav-item">
            <span class="nav-icon">📅</span>
            <span>Calendar</span>
          </a>

          <a href="#" class="nav-item">
            <span class="nav-icon">📊</span>
            <span>Analytics</span>
          </a>

          <a href="#" class="nav-item">
            <span class="nav-icon">👥</span>
            <span>Team</span>
          </a>
        </nav>
      </div>

      <!-- General menu -->
      <div class="nav-section">
        <p class="nav-label">GENERAL</p>

        <nav class="nav-list">
          <a href="#" class="nav-item">
            <span class="nav-icon">⚙️</span>
            <span>Settings</span>
          </a>

          <a href="#" class="nav-item">
            <span class="nav-icon">❓</span>
            <span>Help</span>
          </a>

          <a href="#" class="nav-item">
            <span class="nav-icon">↩</span>
            <span>Logout</span>
          </a>
        </nav>
      </div>

      <!-- Download app promo card -->
      <div class="promo-card">
        <div class="promo-icon">⚙️</div>
        <p class="promo-title">Download our Mobile App</p>
        <p class="promo-subtitle">Get easy in another way</p>
        <button class="promo-btn">Download</button>
      </div>

    </aside>

    <!-- Main content placeholder -->
    <main class="main-content">
      <h1>Main dashboard goes here next</h1>
    </main>

  </div>

</body>
</html>
